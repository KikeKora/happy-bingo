<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Games · OBS HUD v6</title>
<style>
:root{
  --hud-scale:1;
  --blue:#0aa8ff;
  --cyan:#64f1ff;
  --yellow:#ffe34f;
  --pink:#ff4fa3;
  --green:#5cff8e;
  --bg:rgba(4,13,25,.94);
  --bg2:rgba(11,35,59,.95);
  --line:rgba(127,214,255,.26);
  --text:#f7fbff;
  --muted:#9fbad0;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Arial,sans-serif;color:var(--text)}
body{pointer-events:none}

.gameStatus{
  position:fixed;left:18px;top:18px;z-index:20;
  display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:9px;
  width:300px;min-height:56px;padding:7px 10px 7px 8px;border-radius:16px;
  background:linear-gradient(145deg,rgba(4,13,25,.92),rgba(11,35,59,.93));
  border:1px solid rgba(127,214,255,.28);box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(8px);
  transition:width .42s cubic-bezier(.22,.88,.26,1),padding .42s cubic-bezier(.22,.88,.26,1),gap .42s ease,border-radius .42s ease,opacity .28s ease;
  overflow:hidden;
}
.gameStatus.compact{
  width:54px;
  grid-template-columns:42px 0 0;
  gap:0;
  padding:7px 6px;
  border-radius:0 16px 16px 0;
}
.gameStatus img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 5px 9px rgba(0,0,0,.38));transition:transform .35s ease}
.gameStatus.compact img{transform:translateX(-1px)}
.gameStatusCopy{min-width:0;line-height:1;opacity:1;transition:opacity .18s ease,width .32s ease}
.gameStatus.compact .gameStatusCopy{opacity:0;width:0;pointer-events:none}
.gameStatus.compact .gameStatusDot{opacity:0;width:0;margin:0;box-shadow:none;animation:none}
.gameStatusCopy b{display:block;font:italic 900 16px/1 Impact,"Arial Black",sans-serif;letter-spacing:.35px;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gameStatusCopy span{display:block;margin-top:4px;font-size:9px;font-weight:800;color:#b7d0e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gameStatusDot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulseDot 1.4s ease-in-out infinite}
.gameStatusDot.waiting{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.gameStatusDot.finished{background:#7f9eb5;box-shadow:none;animation:none}
.hud{
  position:fixed;
  width:332px;
  opacity:0;
  visibility:hidden;
  transform:translateY(16px) scale(var(--hud-scale));
  transition:opacity .36s ease,transform .42s cubic-bezier(.22,.88,.26,1),visibility .36s ease;
  transform-origin:bottom right;
}
.hud.visible{opacity:1;visibility:visible;transform:translateY(0) scale(var(--hud-scale));}
.panel{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(145deg,var(--bg),var(--bg2));border:1px solid var(--line);box-shadow:0 18px 42px rgba(0,0,0,.40);backdrop-filter:blur(9px)}
.panel:before{content:"";position:absolute;inset:auto -80px -80px auto;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(100,241,255,.18),transparent 68%);pointer-events:none}
.panel:after{content:"";position:absolute;inset:-70px auto auto -60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,163,.15),transparent 65%);pointer-events:none}
.header{position:relative;z-index:1;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 10px 8px;border-bottom:1px solid rgba(127,214,255,.12)}
.mascot{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:bob 2.6s ease-in-out infinite}
.titleWrap strong{display:block;font:italic 900 22px/.94 Impact,"Arial Black",sans-serif;letter-spacing:.4px;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.30)}
.titleWrap span{display:block;margin-top:3px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metaStack{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:66px}
.count{padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(127,214,255,.16);font:900 18px/1 Impact,"Arial Black",sans-serif;color:var(--yellow);text-align:center;min-width:62px}
.count small{display:block;margin-top:1px;font:800 8px/1 Inter,Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#d7ebff}
.reason{padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(127,214,255,.12);font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:#dff6ff;max-width:108px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infoBar{position:relative;z-index:1;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:7px 10px;background:rgba(255,255,255,.03)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:23px;padding:4px 8px;border-radius:999px;border:1px solid rgba(127,214,255,.16);background:rgba(255,255,255,.04);font-size:10px;font-weight:900;color:#e5f7ff;white-space:nowrap}
.chip.swap{border-color:rgba(255,227,79,.24);color:var(--yellow)}
.chip.swap.open{border-color:rgba(255,79,163,.48);color:#ff9ccc;animation:swapPulse .95s ease-in-out infinite}
.rank{position:relative;z-index:1;padding:7px 9px 9px}
.rankHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 6px;border-bottom:1px dashed rgba(127,214,255,.18)}
.rankHead strong{font:italic 900 14px/1 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.4px}
.rankHead span{font-size:9px;color:var(--muted)}
.rows{display:grid;gap:4px;padding-top:6px}
.row{height:30px;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:0 7px;border-radius:11px;background:rgba(255,255,255,.03)}
.row:first-child{background:linear-gradient(90deg,rgba(255,227,79,.14),rgba(255,255,255,.03));border:1px solid rgba(255,227,79,.16)}
.row.moved{animation:rankMove .7s ease}
.pos{font:italic 900 14px/1 Impact,"Arial Black",sans-serif;color:var(--cyan)}
.row:first-child .pos{color:var(--yellow)}
.name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:1000}
.name em{font-style:normal;font-size:8px;color:var(--yellow);margin-left:4px}
.pts{font:900 12px/1 Arial,sans-serif;color:#fff}
.empty{padding:14px 8px 8px;color:var(--muted);font-size:13px;text-align:center}
.previewControls{position:fixed;right:16px;top:16px;display:none;gap:6px;flex-wrap:wrap;max-width:580px;justify-content:flex-end;pointer-events:auto}
.previewControls.show{display:flex}
.previewControls button{cursor:pointer;border:1px solid rgba(127,214,255,.28);border-radius:10px;background:#081a2e;color:#fff;padding:8px 10px;font-weight:900;font-size:11px}
.previewControls button:hover{background:#0c2b48}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.78)}}
@keyframes swapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes rankMove{0%{transform:translateX(0)}35%{transform:translateX(8px);background:rgba(100,241,255,.11)}100%{transform:translateX(0)}}
@media(max-width:1200px){.hud{width:350px}.titleWrap strong{font-size:24px}.row{height:34px}.name{font-size:13px}}
.matchStart{position:fixed;z-index:9;left:50%;bottom:38px;width:min(850px,calc(100vw - 48px));box-sizing:border-box;padding:29px 32px 29px 116px;color:#fff0c9;background:linear-gradient(110deg,#163c45f7,#102832fa);border:8px solid #b69a61;border-image:url('/assets/happy-map-frame.webp') 150 / 8px / 0 stretch;box-shadow:0 16px 40px #0007;opacity:0;transform:translate(-50%,28px);transition:opacity .35s,transform .45s;visibility:hidden}
 .matchStart.visible{opacity:1;transform:translate(-50%,0);visibility:visible}
 .matchStart img{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:72px;height:72px;object-fit:contain}
 .matchStart h1{font:700 34px/1.15 Georgia,serif;margin:5px 0 9px;color:#fff0c9}
 .matchStart p{font:400 19px/1.4 Arial,sans-serif;margin:0;color:#e1eeea}
 .matchStart .invite{color:#f1d389;font-weight:700}
 @media(max-width:700px){.matchStart{padding:18px 20px 18px 82px;bottom:24px}.matchStart img{width:48px;height:48px;left:15px}.matchStart h1{font-size:25px}.matchStart p{font-size:16px}}
 @media(prefers-reduced-motion:reduce){.matchStart{transition:none}}
 </style>
<link rel="stylesheet" href="/happy-stream-map-v6.css"></head>
<body>
 <section id="matchStart" class="matchStart" role="status" aria-live="polite">
 <img src="/assets/kike-eso.webp" alt="">
 <h1>¡Happy Bingo comenzó!</h1><p><span class="invite">Pide el enlace en el chat.</span> Juega y gana Happy Points.</p>
 </section>
<section id="gameStatus" class="gameStatus">
  <img src="/assets/kike-eso.webp" alt="Kike Kora">
  <div class="gameStatusCopy">
    <b id="gameStatusTitle">Happy Bingo en vivo</b>
    <span id="gameStatusLine">Ronda — · 0 jugadores · esperando partida</span>
  </div>
  <i id="gameStatusDot" class="gameStatusDot waiting"></i>
</section>
<section id="hud" class="hud">
  <div class="panel">
    <div class="header">
      <img class="mascot" src="/assets/kike-eso.webp" alt="Kike Kora">
      <div class="titleWrap">
        <strong>Top de ronda</strong>
        <span id="roundLine">Ronda — · esperando partida</span>
      </div>
      <div class="metaStack">
        <div class="count"><span id="playerCount">0</span><small>jugando</small></div>
        <div id="reasonTag" class="reason">actualización</div>
      </div>
    </div>

    <div class="infoBar">
      <span id="roundChip" class="chip">Ronda —</span>
      <span id="clockChip" class="chip">Min —</span>
      <span id="swapChip" class="chip swap" style="display:none">Happy Swap</span>
    </div>

    <div class="rank">
      <div class="rankHead"><strong>Ranking</strong><span id="rankReason">Top 5</span></div>
      <div id="rows" class="rows"><div class="empty">Todavía no hay puntos.</div></div>
    </div>
  </div>
</section>

<div id="previewControls" class="previewControls">
  <button data-demo="inactive">Sin ronda</button>
  <button data-demo="start">Inicio de partida</button>
  <button data-demo="normal">Ronda activa</button>
  <button data-demo="leader">Nuevo líder</button>
  <button data-demo="bingo">Bingo</button>
  <button data-demo="swap5">Swap 5m</button>
  <button data-demo="swap1">Swap 1m</button>
  <button data-demo="swapopen">Swap activo</button>
  <button data-demo="show">Mostrar</button>
  <button data-demo="hide">Ocultar</button>
</div>

<script>
const qs=new URLSearchParams(location.search);
const PREVIEW=qs.get('preview')==='1';
const GAME_NAME=(qs.get('game')||'Happy Bingo').trim().slice(0,32)||'Happy Bingo';
const STATUS_LEFT=Math.max(0,Math.min(600,Number(qs.get('statusLeft')||18)));
const STATUS_TOP=Math.max(0,Math.min(400,Number(qs.get('statusTop')||18)));
const STATUS_SCALE=Math.max(.70,Math.min(1.35,Number(qs.get('statusScale')||1)));
const SCALE=Math.max(.70,Math.min(1.35,Number(qs.get('scale')||1)));
const RIGHT=Math.max(0,Math.min(600,Number(qs.get('right')||20)));
const BOTTOM=Math.max(0,Math.min(800,Number(qs.get('bottom')||585)));
const SHOW_MS=Math.max(3000,Math.min(30000,Number(qs.get('showMs')||8000)));
const INTERVAL_MS=Math.max(30000,Math.min(600000,Number(qs.get('interval')||180000)));
document.documentElement.style.setProperty('--hud-scale',SCALE);
const hud=document.getElementById('hud');
hud.style.right=RIGHT+'px';
hud.style.bottom=BOTTOM+'px';
const gameStatus=document.getElementById('gameStatus');
gameStatus.style.left=STATUS_LEFT+'px';
gameStatus.style.top=STATUS_TOP+'px';
gameStatus.style.transform='scale('+STATUS_SCALE+')';
gameStatus.style.transformOrigin='top left';
document.getElementById('gameStatusTitle').textContent=GAME_NAME+' en vivo';
const controls=document.getElementById('previewControls');if(PREVIEW)controls.classList.add('show');

const els={
  hud,
  playerCount:document.getElementById('playerCount'),
  roundLine:document.getElementById('roundLine'),
  roundChip:document.getElementById('roundChip'),
  clockChip:document.getElementById('clockChip'),
  swapChip:document.getElementById('swapChip'),
  reasonTag:document.getElementById('reasonTag'),
  rankReason:document.getElementById('rankReason'),
  rows:document.getElementById('rows'),
  gameStatusLine:document.getElementById('gameStatusLine'),
  gameStatusDot:document.getElementById('gameStatusDot')
};

let liveWs=null,reconnectTimer=null,lastData=null,lastLeaderId=null,lastBingoIds=new Set(),hideTimer=null,periodicTimer=null,roundStartTimer=null;
let swapBaseSeconds=null,swapBaseAt=0,swapOpen=false,lastSwapMilestone=null;

function isRoundActive(data){
  if(!data) return false;
  if(data.phase==='finished'||data.gameStatus==='finished') return false;
  return data.registrationOpen===true || data.phase==='full' || data.phase==='sprint' || data.gameStatus==='active';
}
function syncHudAvailability(data,wasActive=false){
  const active=isRoundActive(data);
  gameStatus.classList.toggle('compact',!active);
  if(!active){
    hidePanel();
    clearTimeout(roundStartTimer);
    roundStartTimer=null;
    lastLeaderId=null;
    lastBingoIds=new Set();
  }else if(!wasActive){
    clearTimeout(roundStartTimer);
    roundStartTimer=setTimeout(()=>{
      if(isRoundActive(lastData)) showPanel('Top 5',SHOW_MS);
    },12000);
  }
  return active;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmtClock(s){if(s==null||!Number.isFinite(Number(s)))return'—';s=Math.max(0,Math.floor(Number(s)));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function phaseName(p){return p==='full'?'Partida en curso':p==='sprint'?'Happy Sprint':p==='finished'?'Finalizada':'Esperando Dota'}
function statusPhase(data){
  if(data?.phase==='finished'||data?.gameStatus==='finished')return'finalizada';
  if(data?.phase==='sprint')return'Happy Sprint';
  if(data?.phase==='full'||data?.gameStatus==='active')return'partida en curso';
  return data?.registrationOpen?'registro abierto':'esperando partida';
}
function renderGameStatus(data){
  const players=Number(data?.participants||0);
  els.gameStatusLine.textContent=`Ronda ${data?.round??'—'} · ${players} ${players===1?'jugador':'jugadores'} · ${statusPhase(data)}`;
  els.gameStatusDot.classList.remove('waiting','finished');
  if(data?.phase==='finished'||data?.gameStatus==='finished')els.gameStatusDot.classList.add('finished');
  else if(!(data?.phase==='full'||data?.phase==='sprint'||data?.gameStatus==='active'))els.gameStatusDot.classList.add('waiting');
}
function top5(data){return (data?.top||[]).slice(0,5)}

function showPanel(reason='Actualización',duration=SHOW_MS){
  els.reasonTag.textContent=reason;
  els.rankReason.textContent=reason;
  els.hud.classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>els.hud.classList.remove('visible'),duration);
}
function hidePanel(){clearTimeout(hideTimer);els.hud.classList.remove('visible')}

function renderRows(list){
  const rows=list.slice(0,5);
  if(!rows.length){els.rows.innerHTML='<div class="empty">Todavía no hay puntos en esta ronda.</div>';return}
  els.rows.innerHTML=rows.map((p,i)=>`<div class="row"><div class="pos">#${i+1}</div><div class="name">${esc(p.name)}${p.bingo?' <em>★ BINGO</em>':''}</div><div class="pts">${Number(p.roundPoints||0)} pts</div></div>`).join('');
}

function detectTriggers(data){
  if(!isRoundActive(data)) return;
  const t=top5(data);const leader=t[0]||null;
  if(leader && lastLeaderId!=null && String(leader.id??leader.name)!==String(lastLeaderId)){
    showPanel('Nuevo líder',10000);
  }
  if(leader) lastLeaderId=String(leader.id??leader.name);
  const bingoNow=new Set((data.top||[]).filter(p=>p.bingo).map(p=>String(p.id??p.name)));
  for(const id of bingoNow){
    if(!lastBingoIds.has(id)){
      showPanel('Nuevo bingo',11500);
      break;
    }
  }
  lastBingoIds=bingoNow;
}

function renderSwap(swap){
  swap=swap||{};swapOpen=!!swap.open;
  const chip=els.swapChip;
  if(swap.open){
    chip.style.display='inline-flex';chip.classList.add('open');
    swapBaseSeconds=Math.max(0,Number(swap.secondsLeft||0));swapBaseAt=Date.now();
    chip.textContent='↻ Swap activo · '+fmtClock(swapBaseSeconds);
    if(lastSwapMilestone!=='open'){lastSwapMilestone='open';if(isRoundActive(lastData))showPanel('Happy Swap activo',10000);} 
    return;
  }
  chip.classList.remove('open');
  if(swap.upcoming){
    chip.style.display='inline-flex';swapBaseSeconds=Math.max(0,Number(swap.startsInSeconds||0));swapBaseAt=Date.now();
    chip.textContent='Swap en '+fmtClock(swapBaseSeconds);
    return;
  }
  chip.style.display='none';swapBaseSeconds=null;lastSwapMilestone=null;
}

const startPanel=document.getElementById('matchStart');
 let startTimer;let seenStartId=null;
 try{seenStartId=sessionStorage.getItem('happy-obs-last-match');}catch{}
 function renderStart(data){
   const start=data?.matchStartAnnouncement;
   if(!start||start.id===seenStartId||data.gameStatus==='finished')return;
   const remaining=Number(start.expiresAt)-Number(data.serverTs||Date.now());
   if(remaining<=0)return;
   seenStartId=start.id;try{sessionStorage.setItem('happy-obs-last-match',start.id);}catch{}
   startPanel.classList.add('visible');clearTimeout(startTimer);
   startTimer=setTimeout(()=>startPanel.classList.remove('visible'),Math.min(12000,remaining));
 }
 function render(data,trigger=true){
   renderStart(data);
  const prev=lastData;
  const wasActive=isRoundActive(prev);
  lastData={...data,serverTs:Number(data?.serverTs||Date.now())};
  const active=syncHudAvailability(lastData,wasActive);
  els.playerCount.textContent=Number(data.participants||0);
  renderGameStatus(data);
  els.roundLine.textContent=`Ronda ${data.round??'—'} · ${phaseName(data.phase)}${data.registrationOpen?' · registro abierto':''}`;
  els.roundChip.textContent='Ronda '+(data.round??'—');
  els.clockChip.textContent=data.gameClock==null?'Min —':'Min '+fmtClock(data.gameClock);
  renderRows(data.top||[]);renderSwap(data.swap||{});
  if(active&&trigger&&prev) detectTriggers(data);
  else if(active&&!prev){
    const leader=top5(data)[0];
    if(leader) lastLeaderId=String(leader.id??leader.name);
    lastBingoIds=new Set((data.top||[]).filter(p=>p.bingo).map(p=>String(p.id??p.name)));
  }
}

function liveGameClock(){
  if(!lastData)return null;
  const base=Number(lastData.gameClock);
  if(!Number.isFinite(base))return null;
  if(lastData.gameStatus==='active'){
    const elapsed=Math.max(0,(Date.now()-Number(lastData.serverTs||Date.now()))/1000);
    return base+elapsed;
  }
  return base;
}

function updateLocal(){
  if(lastData){const c=liveGameClock();els.clockChip.textContent=c==null?'Min —':'Min '+fmtClock(c)}
  if(swapBaseSeconds==null)return;
  const elapsed=Math.floor((Date.now()-swapBaseAt)/1000);const remain=Math.max(0,swapBaseSeconds-elapsed);
  if(swapOpen){els.swapChip.textContent='↻ Swap activo · '+fmtClock(remain);return}
  els.swapChip.textContent='Swap en '+fmtClock(remain);
  let milestone=null;
  if(remain<=60) milestone='1m'; else if(remain<=300) milestone='5m';
  if(milestone && milestone!==lastSwapMilestone){
    lastSwapMilestone=milestone;
    if(isRoundActive(lastData)) showPanel(milestone==='1m'?'Swap en 1 minuto':'Swap se acerca',9500);
  }
}
setInterval(updateLocal,500);

function connect(){
  if(PREVIEW) return;
  if(liveWs){try{liveWs.close()}catch{} liveWs=null}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  liveWs=new WebSocket(proto+'//'+location.host+'/api/public/ws');
  liveWs.onopen=()=>{};
  liveWs.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.kind==='public_state') render(m.state||{})}catch{}};
  liveWs.onclose=()=>{if(!reconnectTimer) reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect()},2200)};
  liveWs.onerror=()=>{try{liveWs.close()}catch{}};
}

function previewData(mode='normal'){
  const base={registrationOpen:true,participants:30,maxParticipants:200,round:6,phase:'full',gameClock:386,gameStatus:'active',swap:{open:false,upcoming:false,minute:14,secondsLeft:0,startsInSeconds:454},top:[
    {id:'1',name:'MapacheDota',roundPoints:425,bingo:true},{id:'2',name:'CrystalMai',roundPoints:370,bingo:false},{id:'3',name:'LuisitoSupport',roundPoints:325,bingo:false},{id:'4',name:'PudgeNoFalla',roundPoints:280,bingo:false},{id:'5',name:'AnaDota',roundPoints:250,bingo:false}
  ]};
  if(mode==='leader') base.top=[{id:'2',name:'CrystalMai',roundPoints:470,bingo:false},{id:'1',name:'MapacheDota',roundPoints:425,bingo:true},{id:'3',name:'LuisitoSupport',roundPoints:325,bingo:false},{id:'4',name:'PudgeNoFalla',roundPoints:280,bingo:false},{id:'5',name:'AnaDota',roundPoints:250,bingo:false}];
  if(mode==='bingo') base.top[1]={...base.top[1],bingo:true,roundPoints:620};
  if(mode==='swap5') base.swap={open:false,upcoming:true,minute:14,secondsLeft:0,startsInSeconds:299};
  if(mode==='swap1') base.swap={open:false,upcoming:true,minute:14,secondsLeft:0,startsInSeconds:59};
  if(mode==='swapopen') base.swap={open:true,upcoming:false,minute:14,secondsLeft:74,startsInSeconds:0};
  if(mode==='inactive'){
    base.registrationOpen=false;
    base.participants=0;
    base.round=null;
    base.phase='waiting';
    base.gameClock=null;
    base.gameStatus='waiting';
    base.swap={open:false,upcoming:false};
    base.top=[];
  }
  return base;
}

if(PREVIEW){
  render(previewData(),false);
  showPanel('Vista previa',9999999);
  controls.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const mode=b.dataset.demo;if(!mode)return;
    if(mode==='start'){seenStartId=null;hidePanel();render({...previewData(),matchStartAnnouncement:{id:'demo-'+Date.now(),expiresAt:Date.now()+15000}},false);return}
    if(mode==='hide'){hidePanel();startPanel.classList.remove('visible');return}
    if(mode==='show'){showPanel('Vista previa',9999999);return}
    render(previewData(mode),mode!=='normal'&&mode!=='inactive');
    if(mode==='inactive'){hidePanel();return}
    if(mode==='normal') showPanel('Top 5',9999999);
    if(mode==='leader') showPanel('Nuevo líder',9999999);
    if(mode==='bingo') showPanel('Nuevo bingo',9999999);
    if(mode.startsWith('swap')) showPanel(mode==='swapopen'?'Happy Swap activo':'Happy Swap se acerca',9999999);
  });
}else{
  connect();
  periodicTimer=setInterval(()=>{
    if(isRoundActive(lastData)) showPanel('Así va la ronda',SHOW_MS);
    else hidePanel();
  },INTERVAL_MS);
}

window.addEventListener('beforeunload',()=>{
  clearInterval(periodicTimer);
  clearTimeout(hideTimer);
  clearTimeout(reconnectTimer);
  clearTimeout(roundStartTimer);
  try{liveWs?.close()}catch{}
});
</script>
</body>
</html>
