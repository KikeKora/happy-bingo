<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Happy Bingo · OBS Overlay</title>
  <style>
    :root{
      --bg:#071525;
      --panel1:rgba(7,21,37,.92);
      --panel2:rgba(17,45,78,.92);
      --stroke:#9ad7ff;
      --yellow:#ffe45e;
      --pink:#ff5aa5;
      --cyan:#56f2ff;
      --white:#f4fbff;
      --muted:#b9d3e7;
      --shadow:0 16px 48px rgba(0,0,0,.42);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Arial,sans-serif}
    body{display:flex;align-items:flex-end;justify-content:center;padding:26px 32px 24px;color:var(--white)}
    .safe{display:none!important}
    .badge{
      position:absolute;top:18px;left:18px;display:flex;align-items:center;gap:12px;
      padding:10px 14px;border-radius:18px;background:rgba(4,14,25,.75);backdrop-filter:blur(8px);
      border:1px solid rgba(154,215,255,.28);box-shadow:0 10px 26px rgba(0,0,0,.25);
      animation:badgeFloat 4.5s ease-in-out infinite;
    }
    .badge img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
    .badge .mini{display:flex;flex-direction:column;line-height:1.05}
    .badge .mini b{font:italic 900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:.5px;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
    .badge .mini span{font-size:12px;color:var(--muted)}
    .badge .dot{width:9px;height:9px;border-radius:50%;background:#79ff8c;box-shadow:0 0 12px #79ff8c}

    .stack{position:relative;width:min(1080px,100%);height:220px;display:flex;align-items:flex-end;justify-content:center}
    .announcement{
      pointer-events:none;position:absolute;left:50%;bottom:0;transform:translate(-50%,24px) scale(.88);opacity:0;
      width:min(980px,100%);filter:drop-shadow(0 18px 42px rgba(0,0,0,.42));
    }
    .announcement.show{animation:popIn .55s cubic-bezier(.18,.89,.28,1.25) forwards}
    .announcement.hide{animation:popOut .45s ease forwards}
    .card{
      position:relative;display:grid;grid-template-columns:160px 1fr auto;gap:18px;align-items:center;
      min-height:166px;padding:20px 22px;border-radius:28px;
      background:linear-gradient(135deg,var(--panel1),var(--panel2));
      border:2px solid rgba(154,215,255,.45);overflow:hidden;
    }
    .card::before,.card::after{content:"";position:absolute;border-radius:50%;opacity:.35;pointer-events:none}
    .card::before{width:260px;height:260px;right:-90px;top:-80px;background:radial-gradient(circle,var(--cyan),transparent 66%);animation:pulse 2.6s ease-in-out infinite}
    .card::after{width:220px;height:220px;left:-80px;bottom:-120px;background:radial-gradient(circle,var(--pink),transparent 64%);animation:pulse 3.1s ease-in-out infinite reverse}
    .sparkles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .sparkles i{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 12px rgba(255,255,255,.75);animation:rise 2.8s linear infinite}
    .sparkles i:nth-child(1){left:16%;bottom:18%;animation-delay:0s}
    .sparkles i:nth-child(2){left:25%;bottom:9%;animation-delay:.35s}
    .sparkles i:nth-child(3){left:74%;bottom:14%;animation-delay:.9s}
    .sparkles i:nth-child(4){left:84%;bottom:25%;animation-delay:1.35s}
    .sparkles i:nth-child(5){left:58%;bottom:10%;animation-delay:1.8s}

    .heroWrap{position:relative;display:flex;justify-content:center;align-items:flex-end;height:100%}
    .heroHalo{position:absolute;inset:10px 12px 14px;border-radius:26px;background:radial-gradient(circle at 50% 35%,rgba(255,228,94,.26),rgba(86,242,255,.08),transparent 72%)}
    .heroWrap img{position:relative;max-height:150px;max-width:140px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4));animation:bob 2.2s ease-in-out infinite}

    .copy{position:relative;z-index:1;min-width:0}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#dff6ff}
    .eyebrow .flash{font-size:15px;animation:blink 1.2s ease-in-out infinite}
    .title{margin:8px 0 5px;font:italic 900 clamp(30px,3.2vw,46px)/.92 Impact,"Arial Black",sans-serif;letter-spacing:.5px;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.34)}
    .winners{font-size:20px;font-weight:900;line-height:1.12;color:#fff}
    .detail{margin-top:7px;font-size:15px;line-height:1.3;color:var(--muted)}
    .detail b{color:#fff}
    .achievement{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff}

    .scoreCol{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:180px}
    .scorePill{padding:13px 20px;border-radius:20px;background:linear-gradient(180deg,#fff2a5,#ffd74a);color:#332300;border:2px solid rgba(255,255,255,.35);box-shadow:0 12px 24px rgba(0,0,0,.22);text-align:center;transform-origin:center;animation:wobble 2.4s ease-in-out infinite}
    .scorePill small{display:block;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.78}
    .scorePill strong{display:block;font:italic 900 34px/1 Impact,"Arial Black",sans-serif}
    .meta{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:13px;color:#dcecff;text-align:right;white-space:nowrap}
    .meta b{color:#fff}

    .roundFinal{
      pointer-events:none;position:fixed;left:50%;top:51%;z-index:60;
      width:min(1120px,92vw);opacity:0;transform:translate(-50%,-45%) scale(.90);
      filter:drop-shadow(0 26px 70px rgba(0,0,0,.55));
    }
    .roundFinal.show{animation:finalIn .68s cubic-bezier(.18,.89,.28,1.18) forwards}
    .roundFinal.hide{animation:finalOut .5s ease forwards}
    .finalCard{
      position:relative;overflow:hidden;display:grid;grid-template-columns:180px minmax(0,1fr) 310px;
      gap:22px;align-items:center;padding:25px 28px 22px;border-radius:32px;
      background:linear-gradient(135deg,rgba(5,19,34,.97),rgba(13,49,83,.97));
      border:3px solid rgba(255,228,94,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .finalCard::before{content:"";position:absolute;inset:-2px;background:
      linear-gradient(115deg,transparent 0 33%,rgba(86,242,255,.12) 33% 37%,transparent 37% 63%,rgba(255,90,165,.11) 63% 67%,transparent 67%);
      pointer-events:none}
    .finalHero{position:relative;height:210px;display:flex;align-items:flex-end;justify-content:center;z-index:1}
    .finalHero::before{content:"";position:absolute;width:165px;height:165px;border-radius:50%;bottom:15px;background:radial-gradient(circle,rgba(255,228,94,.28),rgba(86,242,255,.10),transparent 68%);animation:pulse 2.2s ease-in-out infinite}
    .finalHero img{position:relative;max-width:170px;max-height:205px;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.48));animation:bob 2s ease-in-out infinite}
    .finalMain{position:relative;z-index:1;min-width:0}
    .finalTag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:linear-gradient(180deg,#fff3aa,#ffd74a);color:#392800;font-weight:1000;font-size:13px;text-transform:uppercase;letter-spacing:.9px;box-shadow:0 8px 18px rgba(0,0,0,.22)}
    .finalTitle{margin:9px 0 2px;font:italic 900 27px/1 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:1px;color:#8eeeff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
    .finalName{font:italic 900 clamp(42px,4.4vw,66px)/.9 Impact,"Arial Black",sans-serif;text-transform:uppercase;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .finalStats{margin-top:10px;display:flex;gap:9px;flex-wrap:wrap}
    .finalStat{padding:7px 11px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:13px;font-weight:800;color:#dff4ff}
    .finalStat strong{color:#fff}
    .finalSide{position:relative;z-index:1}
    .finalSideTitle{font:900 13px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:1.2px;color:#a7cde6;margin-bottom:8px}
    .podium{display:grid;gap:7px}
    .podiumRow{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12)}
    .podiumRow:first-child{background:rgba(255,228,94,.12);border-color:rgba(255,228,94,.35)}
    .podiumRank{font:italic 900 20px/1 Impact,"Arial Black",sans-serif;color:#ffe45e;text-align:center}
    .podiumName{font-size:14px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .podiumPts{font-size:13px;font-weight:900;color:#bfe8ff;white-space:nowrap}
    .finalAwards{position:relative;z-index:1;grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:13px;border-top:1px solid rgba(255,255,255,.12)}
    .awardChip{display:flex;align-items:center;gap:7px;max-width:260px;padding:7px 10px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:12px;color:#dceeff}
    .awardChip b{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .awardIcon{font-size:16px}
    .finalMeta{margin-left:auto;padding:7px 10px;border-radius:13px;background:rgba(86,242,255,.08);border:1px solid rgba(86,242,255,.22);font-size:12px;font-weight:800;color:#dff9ff;white-space:nowrap}

    .rankSummary{pointer-events:none;position:fixed;right:24px;top:160px;z-index:45;width:340px;opacity:0;visibility:hidden;transform:translateX(28px) scale(.94);transform-origin:top right;transition:opacity .32s ease,transform .42s cubic-bezier(.18,.89,.28,1.12),visibility .32s ease;filter:drop-shadow(0 18px 42px rgba(0,0,0,.42))}
    .rankSummary.show{opacity:1;visibility:visible;transform:translateX(0) scale(1)}
    .rankCard{overflow:hidden;border-radius:20px;background:linear-gradient(145deg,rgba(5,18,32,.96),rgba(13,48,81,.96));border:2px solid rgba(100,241,255,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
    .rankTop{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;padding:10px 11px 9px;border-bottom:1px solid rgba(127,214,255,.15)}
    .rankTop img{width:43px;height:43px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
    .rankTitle b{display:block;font:italic 900 21px/.95 Impact,"Arial Black",sans-serif;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
    .rankTitle span{display:block;margin-top:4px;font-size:10px;font-weight:800;color:#add0e7}
    .rankPlayers{padding:6px 8px;border-radius:999px;background:rgba(255,228,94,.12);border:1px solid rgba(255,228,94,.26);font-size:10px;font-weight:1000;color:var(--yellow);white-space:nowrap}
    .rankRows{display:grid;gap:4px;padding:8px}
    .rankRow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:31px;padding:4px 8px;border-radius:11px;background:rgba(255,255,255,.045)}
    .rankRow:first-child{background:linear-gradient(90deg,rgba(255,228,94,.16),rgba(255,255,255,.045));border:1px solid rgba(255,228,94,.18)}
    .rankPos{font:italic 900 15px/1 Impact,"Arial Black",sans-serif;color:var(--cyan)}
    .rankRow:first-child .rankPos{color:var(--yellow)}
    .rankName{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:1000;color:#fff}
    .rankName em{font-style:normal;font-size:8px;color:var(--yellow)}
    .rankPts{font-size:12px;font-weight:1000;color:#fff;white-space:nowrap}

    .controls{position:fixed;right:18px;bottom:18px;display:none;gap:8px;pointer-events:auto}
    .controls.show{display:flex;flex-wrap:wrap;max-width:420px;justify-content:flex-end}
    .controls button{cursor:pointer;border:0;border-radius:14px;padding:10px 12px;background:#0b1f34;color:#fff;font-weight:800;box-shadow:0 10px 22px rgba(0,0,0,.28)}
    .controls button:hover{transform:translateY(-1px)}

    @keyframes popIn{0%{opacity:0;transform:translate(-50%,28px) scale(.88)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
    @keyframes popOut{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,18px) scale(.95)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.1);opacity:.55}}
    @keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) scale(1.15);opacity:0}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes wobble{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-2deg) scale(1.02)}}
    @keyframes blink{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.65}}
    @keyframes badgeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes finalIn{0%{opacity:0;transform:translate(-50%,-40%) scale(.82) rotate(-1deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
    @keyframes finalOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-54%) scale(.95)}}

    @media (max-width:900px){
      body{padding:12px 12px 16px}
      .stack{height:250px}
      .card{grid-template-columns:112px 1fr;gap:12px;padding:16px 16px 18px;min-height:186px}
      .scoreCol{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center;min-width:0}
      .heroWrap img{max-height:110px}
      .title{font-size:32px}
      .winners{font-size:17px}
      .detail{font-size:13px}
      .scorePill strong{font-size:29px}
      .badge{transform:scale(.92);transform-origin:top left}
      .roundFinal{width:96vw;top:50%}
      .finalCard{grid-template-columns:105px 1fr;padding:16px;gap:13px}
      .finalHero{height:150px}.finalHero img{max-width:105px;max-height:145px}
      .finalSide{grid-column:1/-1}.finalAwards{grid-column:1/-1}
      .finalName{font-size:40px}.finalMeta{margin-left:0}
      .rankSummary{right:12px;top:110px;width:320px}
    }
  </style>
<link rel="stylesheet" href="/happy-stream-map-v6.css"></head>
<body>

  <div class="stack" id="stack"></div>
  <aside id="rankSummary" class="rankSummary" aria-live="polite"></aside>

  <div id="controls" class="controls">
    <button data-demo="cell">Probar casilla</button>
    <button data-demo="line">Probar línea</button>
    <button data-demo="bingo">Probar bingo</button>
    <button data-demo="final">Probar cierre</button>
    <button data-demo="ranking">Probar ranking</button>
    <button id="clearBtn">Limpiar</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const PREVIEW = params.get('preview') === '1';
    const SOUND_ENABLED = params.get('sound') !== '0';
    const RANKING_ENABLED = params.get('ranking') !== '0';
    const RANK_INTERVAL_MS = Math.max(30000, Math.min(600000, Number(params.get('rankInterval') || 180000)));
    const RANK_SHOW_MS = Math.max(4000, Math.min(30000, Number(params.get('rankShowMs') || 9000)));
    const RANK_FIRST_MS = Math.max(3000, Math.min(120000, Number(params.get('rankFirstMs') || 15000)));
    const RANK_TOP = Math.max(0, Math.min(800, Number(params.get('rankTop') || 160)));
    const RANK_RIGHT = Math.max(0, Math.min(800, Number(params.get('rankRight') || 24)));
    const stack = document.getElementById('stack');
    const rankSummary = document.getElementById('rankSummary');
    rankSummary.style.top=RANK_TOP+'px';
    rankSummary.style.right=RANK_RIGHT+'px';
    const controls = document.getElementById('controls');
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = protocol + '//' + location.host + '/api/overlay/ws';
    let ws = null;
    let reconnectTimer = null;
    let activeAnnouncement = null;
    let hideTimer = null;
    let activeFinal = null;
    let finalHideTimer = null;
    let latestPublicState = null;
    let rankingHideTimer = null;
    let rankingFirstTimer = null;
    let rankingIntervalTimer = null;

    if (PREVIEW) controls.classList.add('show');

    function esc(value){
      return String(value ?? '').replace(/[&<>"']/g, ch=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[ch]);
    }

    function clearRoundFinal(force=false){
      if(!activeFinal) return;
      if(finalHideTimer){ clearTimeout(finalHideTimer); finalHideTimer=null; }
      const node=activeFinal; activeFinal=null;
      if(force){ node.remove(); return; }
      node.classList.remove('show'); node.classList.add('hide');
      setTimeout(()=>node.remove(),520);
    }

    function rankingActive(state){
      if(!state || state.phase==='finished' || state.gameStatus==='finished') return false;
      return Number(state.participants||0)>0 && (state.gameStatus==='active' || state.phase==='full' || state.phase==='sprint');
    }

    function hideRanking(force=false){
      if(rankingHideTimer){ clearTimeout(rankingHideTimer); rankingHideTimer=null; }
      rankSummary.classList.remove('show');
      if(force) rankSummary.innerHTML='';
    }

    function renderRanking(state,reason='Así va el Bingo'){
      if(!RANKING_ENABLED || !rankingActive(state) || activeFinal) return;
      const top=Array.isArray(state.top)?state.top.slice(0,5):[];
      if(!top.length) return;
      if(rankingHideTimer){ clearTimeout(rankingHideTimer); rankingHideTimer=null; }
      const rows=top.map((p,i)=>`<div class="rankRow"><span class="rankPos">#${i+1}</span><span class="rankName">${esc(p.name||'Jugador')}${p.bingo?' <em>★ BINGO</em>':''}</span><span class="rankPts">${Number(p.roundPoints||0)} pts</span></div>`).join('');
      rankSummary.innerHTML=`<div class="rankCard"><div class="rankTop"><img src="/assets/kike-eso.webp" alt=""><div class="rankTitle"><b>${esc(reason)}</b><span>Ronda ${esc(state.round??'—')} · Top 5 actual</span></div><span class="rankPlayers">${Number(state.participants||0)} jugando</span></div><div class="rankRows">${rows}</div></div>`;
      requestAnimationFrame(()=>rankSummary.classList.add('show'));
      rankingHideTimer=setTimeout(()=>hideRanking(false),RANK_SHOW_MS);
    }

    function updatePublicState(state){
      const wasActive=rankingActive(latestPublicState);
      latestPublicState=state||null;
      const active=rankingActive(latestPublicState);
      if(!active){ clearTimeout(rankingFirstTimer); rankingFirstTimer=null; hideRanking(true); return; }
      if(!wasActive){
        clearTimeout(rankingFirstTimer);
        rankingFirstTimer=setTimeout(()=>renderRanking(latestPublicState,'Así va el Bingo'),RANK_FIRST_MS);
      }
    }

    function playRoundFinalSfx(){
      if(!SOUND_ENABLED) return;
      try{
        const AudioCtx=window.AudioContext||window.webkitAudioContext;
        const ctx=new AudioCtx(); const now=ctx.currentTime; const master=ctx.createGain();
        master.gain.setValueAtTime(.0001,now); master.gain.exponentialRampToValueAtTime(.16,now+.03); master.gain.exponentialRampToValueAtTime(.0001,now+1.8); master.connect(ctx.destination);
        [261.63,329.63,392,523.25,659.25].forEach((freq,i)=>{
          const osc=ctx.createOscillator(),gain=ctx.createGain(); osc.type=i<3?'triangle':'sawtooth'; osc.frequency.setValueAtTime(freq,now+i*.11);
          gain.gain.setValueAtTime(.0001,now+i*.11); gain.gain.exponentialRampToValueAtTime(.13,now+i*.11+.02); gain.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.42);
          osc.connect(gain);gain.connect(master);osc.start(now+i*.11);osc.stop(now+i*.11+.46);
        });
        setTimeout(()=>ctx.close().catch(()=>{}),2200);
      }catch{}
    }

    function renderRoundFinal(data){
      clearAnnouncement(true); clearRoundFinal(true); hideRanking(true);
      const mvp=data.mvp||((data.top3||[])[0])||{};
      const top3=Array.isArray(data.top3)?data.top3.slice(0,3):[];
      const awards=(Array.isArray(data.awards)?data.awards:[]).filter(a=>a&&a.id!=='mvp').slice(0,4);
      const lines=Number(mvp.linesCompleted||0);
      const result=data.kikeWon==null?'Resultado cerrado':(data.kikeWon?'Kike ganó':'Kike perdió');
      const outer=document.createElement('div'); outer.className='roundFinal';
      const podiumHtml=top3.map((p,i)=>`<div class="podiumRow"><div class="podiumRank">#${i+1}</div><div class="podiumName">${esc(p.name||'Jugador')}</div><div class="podiumPts">${Number(p.roundPoints||0)} pts</div></div>`).join('');
      const awardsHtml=awards.map(a=>`<div class="awardChip"><span class="awardIcon">${esc(a.icon||'★')}</span><div><b>${esc(a.title||'Reconocimiento')}</b><br>${esc(a.name||'')}</div></div>`).join('');
      outer.innerHTML=`
        <div class="finalCard">
          <div class="finalHero"><img src="/assets/kike-risa.webp" alt="Kike Kora chibi"></div>
          <div class="finalMain">
            <div class="finalTag">🏆 Cierre de ronda</div>
            <div class="finalTitle">MVP DE LA RONDA</div>
            <div class="finalName">${esc(mvp.name||'Sin ganador')}</div>
            <div class="finalStats">
              <div class="finalStat"><strong>${Number(mvp.roundPoints||0)}</strong> Happy Points</div>
              <div class="finalStat"><strong>${lines}</strong> ${lines===1?'línea':'líneas'}</div>
              ${mvp.bingo?'<div class="finalStat"><strong>✓</strong> BINGO</div>':''}
            </div>
          </div>
          <div class="finalSide">
            <div class="finalSideTitle">Top 3 final</div>
            <div class="podium">${podiumHtml}</div>
          </div>
          <div class="finalAwards">
            ${awardsHtml || '<div class="awardChip"><span class="awardIcon">★</span><div><b>Gran ronda</b><br>Gracias por jugar</div></div>'}
            <div class="finalMeta">Ronda ${esc(data.round??'—')} · ${Number(data.participants||0)} jugadores · ${esc(result)}</div>
          </div>
        </div>`;
      document.body.appendChild(outer);
      requestAnimationFrame(()=>outer.classList.add('show'));
      activeFinal=outer; playRoundFinalSfx();
      finalHideTimer=setTimeout(()=>clearRoundFinal(false),Math.max(8500,Number(data.displayMs||11500)));
    }

    function achievementLabel(type, label){
      if(type === 'bingo') return 'BINGO completo';
      if(type === 'line') return label || 'Línea completa';
      return label || 'Casilla completada';
    }

    function winnersCopy(names, extraCount, type){
      const safeNames = Array.isArray(names) ? names.filter(Boolean) : [];
      if(!safeNames.length) return '¡Hay nuevos ganadores en el Happy Bingo!';
      if(safeNames.length === 1 && !extraCount){
        return `${safeNames[0]} ${type === 'bingo' ? 'logró' : 'completó'} el objetivo.`;
      }
      if(safeNames.length === 2 && !extraCount){
        return `${safeNames[0]} y ${safeNames[1]} ${type === 'bingo' ? 'lograron' : 'completaron'} el objetivo.`;
      }
      const shown = safeNames.slice(0,2).join(' y ');
      return `${shown} + ${extraCount} ${extraCount === 1 ? 'persona' : 'personas'} ${type === 'bingo' ? 'lograron' : 'completaron'} el objetivo.`;
    }

    function announcementEyebrow(type){
      if(type === 'bingo') return 'BINGO desbloqueado';
      if(type === 'line') return 'Nueva línea completada';
      return 'Nueva casilla completada';
    }

    function createSparkles(){
      const wrap = document.createElement('div');
      wrap.className = 'sparkles';
      for(let i=0;i<5;i++) wrap.appendChild(document.createElement('i'));
      return wrap;
    }


    function playOverlaySfx(type){
      if(!SOUND_ENABLED) return;
      try{
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(type==='bingo'?0.18:0.10, now+0.02);
        master.gain.exponentialRampToValueAtTime(0.0001, now+(type==='bingo'?1.25:0.62));
        master.connect(ctx.destination);
        const notes = type==='bingo' ? [392,523.25,659.25,783.99] : type==='line' ? [440,554.37,659.25] : [523.25,659.25];
        notes.forEach((freq,i)=>{
          const osc=ctx.createOscillator();
          const gain=ctx.createGain();
          osc.type=type==='bingo'?'sawtooth':'triangle';
          osc.frequency.setValueAtTime(freq,now+i*0.08);
          gain.gain.setValueAtTime(0.0001,now+i*0.08);
          gain.gain.exponentialRampToValueAtTime(type==='bingo'?0.18:0.12,now+i*0.08+0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001,now+i*0.08+0.28);
          osc.connect(gain);gain.connect(master);osc.start(now+i*0.08);osc.stop(now+i*0.08+0.32);
        });
        setTimeout(()=>ctx.close().catch(()=>{}),1600);
      }catch{}
    }
    function clearAnnouncement(force = false){
      if(!activeAnnouncement) return;
      if(hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
      const node = activeAnnouncement;
      activeAnnouncement = null;
      if(force){ node.remove(); return; }
      node.classList.remove('show');
      node.classList.add('hide');
      setTimeout(()=>node.remove(), 450);
    }

    function renderAnnouncement(data){
      clearAnnouncement(true); hideRanking(false);
      const names = data.names || [];
      const extraCount = Number(data.extraCount || 0);
      const totalCount = Number(data.totalCount || names.length || 1);
      const label = achievementLabel(data.type, data.label);
      const points = Number(data.points || 0);

      const outer = document.createElement('div');
      outer.className = 'announcement';
      outer.innerHTML = `
        <div class="card">
          <div class="heroWrap">
            <div class="heroHalo"></div>
            <img src="${data.type === 'bingo' ? '/assets/kike-risa.webp' : '/assets/kike-eso.webp'}" alt="Kike Kora chibi">
          </div>
          <div class="copy">
            <div class="eyebrow"><span class="flash">⚡</span>${announcementEyebrow(data.type)}</div>
            <div class="title">${data.title || '¡Happy Bingo!'}</div>
            <div class="winners">${winnersCopy(names, extraCount, data.type)}</div>
            <div class="detail"><b>${totalCount}</b> ${totalCount === 1 ? 'jugador' : 'jugadores'} · <span class="achievement">${label}</span></div>
          </div>
          <div class="scoreCol">
            <div class="scorePill"><small>Happy Points</small><strong>+${points}</strong></div>
            <div class="meta"><b>${data.type === 'bingo' ? 'Gran premio' : data.type === 'line' ? 'Bonus de línea' : 'Objetivo cumplido'}</b><br>Ronda ${data.round ?? '—'} · ${data.participants ?? 0} en juego</div>
          </div>
        </div>`;
      outer.firstElementChild.appendChild(createSparkles());
      stack.appendChild(outer);
      requestAnimationFrame(()=> outer.classList.add('show'));
      activeAnnouncement = outer;
      playOverlaySfx(data.type);
      hideTimer = setTimeout(()=>clearAnnouncement(false), Math.max(5200, Number(data.displayMs || 7200)));
    }

    function onSocketMessage(payload){
      if(payload.kind === 'overlay_hello') return;
      if(payload.kind === 'overlay_announcement'){
        renderAnnouncement(payload);
      }
      if(payload.kind === 'public_state'){
        updatePublicState(payload.state||{});
      }
      if(payload.kind === 'overlay_round_final'){
        renderRoundFinal(payload);
      }
      if(payload.kind === 'overlay_clear'){
        clearAnnouncement(true);
        clearRoundFinal(true);
        hideRanking(true);
      }
    }

    function connect(){
      if(ws){ try{ ws.close(); }catch{} ws = null; }
      ws = new WebSocket(wsUrl);
      ws.addEventListener('open', ()=>{
        if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
      });
      ws.addEventListener('message', (ev)=>{
        try{ onSocketMessage(JSON.parse(ev.data)); }catch{}
      });
      ws.addEventListener('close', ()=>{
        if(!reconnectTimer) reconnectTimer = setTimeout(()=>{ reconnectTimer = null; connect(); }, 2200);
      });
      ws.addEventListener('error', ()=>{
        try{ ws.close(); }catch{}
      });
    }

    if(PREVIEW){
      controls.addEventListener('click', (ev)=>{
        const btn = ev.target.closest('button');
        if(!btn) return;
        if(btn.id === 'clearBtn'){ clearAnnouncement(true); clearRoundFinal(true); hideRanking(true); return; }
        const type = btn.dataset.demo;
        if(!type) return;
        const samples = {
          cell:{kind:'overlay_announcement',type:'cell',title:'¡Casilla completada!',label:'Primera sangre de Kike',points:50,names:['Mariana'],extraCount:7,totalCount:8,displayMs:7200,round:4,participants:68},
          line:{kind:'overlay_announcement',type:'line',title:'¡Línea completada!',label:'Línea completa',points:150,names:['Luis','Diana'],extraCount:3,totalCount:5,displayMs:8200,round:4,participants:68},
          bingo:{kind:'overlay_announcement',type:'bingo',title:'¡BINGO!',label:'Bingo completo',points:500,names:['Enrique'],extraCount:0,totalCount:1,displayMs:9800,round:4,participants:68},
          final:{kind:'overlay_round_final',round:4,participants:42,kikeWon:true,mvp:{rank:1,name:'MapacheDota',roundPoints:420,bingo:true,linesCompleted:3},top3:[{rank:1,name:'MapacheDota',roundPoints:420,bingo:true,linesCompleted:3},{rank:2,name:'CrystalMai',roundPoints:350,bingo:true,linesCompleted:2},{rank:3,name:'LuisitoGG',roundPoints:275,bingo:false,linesCompleted:2}],awards:[{id:'mvp',title:'MVP de la ronda',icon:'🏆',name:'MapacheDota'},{id:'first_bingo',title:'Primer Bingo',icon:'⚡',name:'CrystalMai'},{id:'prophet',title:'Profeta de la ronda',icon:'🔮',name:'MapacheDota'},{id:'strategist',title:'Mejor estratega',icon:'🧠',name:'LuisitoGG'}],displayMs:11500}
        };
        if(type==='ranking'){
          renderRanking({round:4,participants:42,phase:'full',gameStatus:'active',top:[{name:'MapacheDota',roundPoints:420,bingo:true},{name:'CrystalMai',roundPoints:350},{name:'LuisitoGG',roundPoints:275},{name:'DianaSupport',roundPoints:220},{name:'PudgeNoFalla',roundPoints:195}]},'Así va el Bingo');
        }else if(type==='final') renderRoundFinal(samples.final); else renderAnnouncement(samples[type]);
      });
    }
    connect();
    if(RANKING_ENABLED) rankingIntervalTimer=setInterval(()=>renderRanking(latestPublicState,'Así va el Bingo'),RANK_INTERVAL_MS);
    window.addEventListener('beforeunload', ()=>{
      if(reconnectTimer) clearTimeout(reconnectTimer);
      if(hideTimer) clearTimeout(hideTimer);
      if(finalHideTimer) clearTimeout(finalHideTimer);
      if(rankingIntervalTimer) clearInterval(rankingIntervalTimer);
      if(rankingHideTimer) clearTimeout(rankingHideTimer);
      if(rankingFirstTimer) clearTimeout(rankingFirstTimer);
      try{ ws?.close(); }catch{}
    });
  </script>
</body>
</html>
